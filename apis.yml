apis:
- name: TD Ameritrade Market Data API
  description: >
    Provides REST endpoints for accessing real-time and historical market data. Includes current quotes
    for single and multiple symbols, historical price history for equities and ETFs, options chains with
    full contract details, top movers by index, and market hours for equities, options, futures, forex,
    and bond markets.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.tdameritrade.com/market-data/apis
  baseURL: https://api.tdameritrade.com/v1
  tags:
  - Market Data
  - Quotes
  - Options Chains
  - Price History
  - Movers
  - Market Hours
  properties:
  - type: Documentation
    url: https://developer.tdameritrade.com/market-data/apis

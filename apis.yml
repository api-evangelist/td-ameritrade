    email: API@TDAmeritrade.com
    url: https://developer.tdameritrade.com/
- name: TD Ameritrade Instruments API
  description: >
    Provides REST endpoints for searching and retrieving instrument details by symbol or CUSIP. Supports
    searching by symbol or description and retrieving fundamental data including financial ratios, earnings,
    and dividend information for equities.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.tdameritrade.com/instruments/apis
  baseURL: https://api.tdameritrade.com/v1
  tags:
  - Instruments
  - Equities
  - Fundamentals
  - Securities

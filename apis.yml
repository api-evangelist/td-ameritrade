- name: TD Ameritrade Streaming Market Data API
  description: >
    Provides a WebSocket-based streaming API that delivers up-to-the-second market data including real-time
    Level 1 and Level 2 quotes, time and sales data for equities, options, and futures, as well as order
    book depth data. Streaming sessions are initiated using credentials obtained from the User Principals
    endpoint.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.tdameritrade.com/content/streaming-data
  baseURL: wss://streamer-ws.tdameritrade.com/ws
  tags:
  - Streaming
  - WebSocket
  - Real-Time
  - Level 2
  - Market Data

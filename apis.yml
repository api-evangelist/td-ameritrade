- name: TD Ameritrade Authentication API
  description: >
    Implements OAuth 2.0 token-based authentication as described in RFC6749 section 1.3.1. Applications
    registered on the TD Ameritrade Developer Portal receive a Consumer Key (client_id). Access tokens
    are valid for 30 minutes; refresh tokens are valid for 90 days and may be used to generate new access
    and refresh tokens.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.tdameritrade.com/authentication/apis
  baseURL: https://api.tdameritrade.com/v1
  tags:
  - Authentication
  - Access Tokens
  tags_raw:
  - Authentication
  - OAuth 2.0
  - Access Tokens
  properties:

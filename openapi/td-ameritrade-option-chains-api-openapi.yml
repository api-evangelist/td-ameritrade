          type: number
        bidSize:
          example: 0
          type: number
        change:
          example: 0
          type: number
        close:
          example: 0
          type: number
        delayed:
          type: boolean
        description:
          example: string
          type: string
        exchangeName:
          example: '''IND'' or ''ASE'' or ''NYS'' or ''NAS'' or ''NAP'' or ''PAC'' or ''OPR'' or ''BATS'''
          type: string
        fiftyTwoWeekHigh:
          example: 0
          type: number
        fiftyTwoWeekLow:
          example: 0
          type: number
        highPrice:
          example: 0
          type: number
        last:
          example: 0
          type: number
        lowPrice:
          example: 0
          type: number
        mark:
          example: 0
          type: number
        markChange:
          example: 0
          type: number
        markPercentChange:
          example: 0
          type: number
        openPrice:
          example: 0
          type: number
        percentChange:
          example: 0
          type: number
        quoteTime:
          example: 0
          type: number
        symbol:
          example: string
          type: string
        totalVolume:
          example: 0
          type: number
        tradeTime:
          example: 0
          type: number
      type: object
    OrderStatus:
      enum:
      - AWAITING_PARENT_ORDER
      - AWAITING_CONDITION
      - AWAITING_MANUAL_REVIEW
      - ACCEPTED
      - AWAITING_UR_OUT
      - PENDING_ACTIVATION
      - WORKING
      - REJECTED
      - QUEUED
      - PENDING_CANCEL
      - CANCELED
      - PENDING_REPLACE
      - REPLACED
      - FILLED
      - EXPIRED
      example: '''AWAITING_PARENT_ORDER'' or ''AWAITING_CONDITION'' or ''AWAITING_MANUAL_REVIEW'' or ''ACCEPTED'' or ''AWAITING_UR_OUT'' or ''PENDING_ACTIVATION'' or ''QUEUED'' or ''WORKING'' or ''REJECTED'' or ''PENDING_CANCEL'' or ''CANCELED'' or ''PENDING_REPLACE'' or ''REPLACED'' or ''FILLED'' or ''EXPIRED'''
